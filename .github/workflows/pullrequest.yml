---
name: Pull Request Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python with uv
        run: uv python install

      - name: Sync environment
        run: uv sync

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  octodns-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python with uv
        run: uv python install

      - name: Sync environment
        run: uv sync

      - name: Run octodns-sync
        env:
          MYTHICBEASTS_API_KEY: ${{ secrets.MYTHICBEASTS_API_KEY }}
          MYTHICBEASTS_API_SECRET: ${{ secrets.MYTHICBEASTS_API_SECRET }}
        run: uv run octodns-sync --config-file config/config.yaml --force
