---
name: Deploy DNS Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'zones/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python with uv
        run: uv python install

      - name: Sync environment
        run: uv sync

      - name: Deploy to production
        env:
          MYTHICBEASTS_API_KEY: ${{ secrets.MYTHICBEASTS_API_KEY }}
          MYTHICBEASTS_API_SECRET: ${{ secrets.MYTHICBEASTS_API_SECRET }}
        run: uv run octodns-sync --config-file config/config.yaml --doit --force
