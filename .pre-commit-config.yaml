---
repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: check octodns config schema
        files: ^config\.yaml$
        args:
          ["--schemafile", "https://octodns.readthedocs.io/en/stable/_static/octodns-config.schema.json"]
      - id: check-jsonschema
        name: check octodns zone schema
        files: ^zones/.*\.ya?ml$
        args:
          ["--schemafile", "https://octodns.readthedocs.io/en/stable/_static/octodns-zone.schema.json"]
